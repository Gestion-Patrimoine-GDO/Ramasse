<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0A2730">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ramasse">
<title>Ramasse — la collecte qui compte</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=Archivo+Black&display=swap" rel="stylesheet">
<style>
:root{
  --bleu-900:#0E2A1E;
  --bleu-850:#123527;
  --bleu-800:#184232;
  --bleu-700:#20583F;
  --creme:#F1EFE3;
  --creme-60:rgba(244,235,216,.60);
  --creme-40:rgba(244,235,216,.50);
  --rouge:#D2452F;
  --laiton:#E7B84B;
  --vert:#8FCB6A;
  --trait:rgba(244,235,216,.15);
  --r:14px;
  --display:"Archivo Black","Archivo",system-ui,sans-serif;
  --body:"Archivo",system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  -webkit-text-size-adjust:100%;
  background:var(--bleu-900);
  color:var(--creme);
  font-family:var(--body);
  font-size:15px;line-height:1.45;
  font-variant-numeric:tabular-nums;
  padding-bottom:calc(74px + env(safe-area-inset-bottom));
  overflow-x:hidden;
}
.wrap{max-width:560px;margin:0 auto;padding:0 14px}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;letter-spacing:-.01em}

/* --- bandeau --- */
header{
  position:sticky;top:0;z-index:20;
  background:linear-gradient(var(--bleu-900) 76%,rgba(10,39,48,0));
  padding-top:env(safe-area-inset-top);
}
.bandeau{display:flex;align-items:center;gap:10px;padding:12px 0 14px}
.marque{display:flex;flex-direction:column;line-height:1;flex:1;min-width:0;background:none;border:0;color:var(--creme);font:inherit;text-align:left;padding:2px 0;cursor:pointer}
.marque b{font-family:var(--display);font-size:19px;letter-spacing:-.02em}
.marque span{font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--creme-40);margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.marqueur{width:8px;height:8px;border-radius:100px;flex-shrink:0;background:transparent;border:1px solid var(--trait)}
.marqueur[data-ici]{background:var(--vert);border-color:var(--vert);box-shadow:0 0 0 3px rgba(127,176,107,.2)}
.jetonjoueur{
  display:flex;align-items:center;gap:8px;flex-shrink:0;
  background:var(--bleu-800);border:1px solid var(--trait);color:var(--creme);
  border-radius:100px;padding:6px 12px 6px 6px;font:inherit;font-size:13px;cursor:pointer;
}
.jetonjoueur .pastille{width:28px;height:28px;border-radius:100px;display:grid;place-items:center;font-size:15px}
.etatsync{width:7px;height:7px;border-radius:100px;background:var(--creme-40);flex-shrink:0}
.etatsync.on{background:var(--vert);box-shadow:0 0 0 3px rgba(127,176,107,.18)}
.etatsync.err{background:var(--rouge)}

/* --- plaques émaillées --- */
.plaque{
  background:var(--bleu-850);
  border:1px solid var(--trait);
  border-radius:var(--r);
  padding:16px;margin-bottom:12px;
  box-shadow:inset 0 1px 0 rgba(244,235,216,.06);
}
.sourcil{
  font-size:10px;letter-spacing:.15em;text-transform:uppercase;
  color:var(--creme-40);margin:0 0 10px;display:flex;justify-content:space-between;align-items:baseline;gap:8px;
}
.sourcil b{font-family:var(--body);font-weight:600;letter-spacing:.06em;color:var(--creme-60)}

/* --- jauge coop --- */
.jauge{position:relative;height:34px;border-radius:8px;background:var(--bleu-900);border:1px solid var(--trait);overflow:hidden}
.jauge i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,var(--bleu-700),var(--vert));transition:width .55s cubic-bezier(.2,.8,.2,1)}
.jauge u{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between;padding:0 11px;text-decoration:none;font-size:12px;font-weight:600}
.jauge.atteint i{background:linear-gradient(90deg,var(--vert),var(--laiton))}
.recompense{margin-top:10px;font-size:13px;color:var(--creme-60)}
.recompense b{color:var(--laiton);font-weight:600}

/* --- barres joueurs --- */
.course{display:flex;flex-direction:column;gap:9px;margin-top:2px}
.piste{display:flex;align-items:center;gap:9px}
.piste .pastille{width:30px;height:30px;border-radius:100px;display:grid;place-items:center;font-size:16px;flex-shrink:0}
.piste .nom{font-size:13px;font-weight:600;width:74px;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.piste .barre{flex:1;height:12px;border-radius:100px;background:var(--bleu-900);overflow:hidden}
.piste .barre i{display:block;height:100%;border-radius:100px;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.piste .pts{font-family:var(--display);font-size:16px;width:52px;text-align:right;flex-shrink:0}
.piste .pts small{font-family:var(--body);font-size:10px;color:var(--creme-40);font-weight:500}

/* --- quête --- */
.quete{display:flex;align-items:center;gap:12px;border:1px dashed rgba(224,168,60,.45);background:rgba(224,168,60,.07)}
.quete .ico{font-size:26px}
.quete .txt{flex:1;min-width:0}
.quete .txt b{display:block;font-size:14px}
.quete .txt span{font-size:12px;color:var(--creme-60)}
.quete .mult{font-family:var(--display);color:var(--laiton);font-size:18px}

/* --- filtres --- */
.filtres{display:flex;gap:7px;overflow-x:auto;padding:2px 14px 12px;margin:0 -14px;scrollbar-width:none}
.filtres::-webkit-scrollbar{display:none}
.filtres button{
  flex-shrink:0;background:var(--bleu-850);border:1px solid var(--trait);color:var(--creme-60);
  font:inherit;font-size:12.5px;padding:7px 13px;border-radius:100px;cursor:pointer;white-space:nowrap;
}
.filtres button[aria-pressed=true]{background:var(--creme);color:var(--bleu-900);border-color:var(--creme);font-weight:600}
.filtres button .n{opacity:.5;margin-left:4px}

/* --- grille de tuiles --- */
.grille{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:9px}
.tuile{
  position:relative;background:var(--bleu-850);border:1px solid var(--trait);border-radius:var(--r);
  padding:12px 10px 10px;display:flex;flex-direction:column;gap:7px;align-items:flex-start;
  color:var(--creme);font:inherit;text-align:left;cursor:pointer;min-height:106px;
  transition:transform .12s,border-color .2s,background .2s;
}
.tuile:active{transform:scale(.955)}
.tuile .em{font-size:25px;line-height:1}
.tuile .lb{font-size:12.5px;line-height:1.25;font-weight:500;flex:1}
.tuile .pt{font-family:var(--display);font-size:13px;color:var(--laiton)}
.tuile.retard{border-color:rgba(210,69,47,.6);background:linear-gradient(var(--bleu-850),rgba(210,69,47,.09))}
.tuile.retard .pt{color:var(--rouge)}
.tuile .tag{
  position:absolute;top:9px;right:9px;font-size:9px;letter-spacing:.08em;text-transform:uppercase;
  background:var(--rouge);color:#fff;padding:2px 6px;border-radius:100px;font-weight:600;
}
.tuile.quete{border-color:rgba(224,168,60,.6)}
.tuile.quete .tag{background:var(--laiton);color:var(--bleu-900)}

/* --- tampon --- */
.tampon{
  position:fixed;inset:0;z-index:60;display:grid;place-items:center;pointer-events:none;
  background:rgba(10,39,48,.35);
}
.tampon .rond{
  width:170px;height:170px;border-radius:100px;border:5px solid var(--rouge);color:var(--rouge);
  display:grid;place-content:center;text-align:center;background:rgba(10,39,48,.9);
  transform:rotate(-13deg) scale(2.4);opacity:0;
  animation:tamponner .62s cubic-bezier(.2,1.3,.35,1) forwards;
}
.tampon .rond b{font-family:var(--display);font-size:44px;line-height:1;display:block}
.tampon .rond span{font-size:11px;letter-spacing:.14em;text-transform:uppercase;display:block;margin-top:7px;opacity:.85}
@keyframes tamponner{
  0%{transform:rotate(-24deg) scale(2.4);opacity:0}
  38%{transform:rotate(-13deg) scale(.94);opacity:1}
  52%{transform:rotate(-13deg) scale(1.02)}
  70%{transform:rotate(-13deg) scale(1);opacity:1}
  100%{transform:rotate(-13deg) scale(1);opacity:0}
}
@media (prefers-reduced-motion:reduce){
  .tampon .rond{animation:fondu .6s linear forwards;transform:rotate(-13deg)}
  @keyframes fondu{0%{opacity:0}20%{opacity:1}70%{opacity:1}100%{opacity:0}}
  .tuile:active{transform:none}
}

/* --- journal --- */
.jour{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--creme-40);margin:18px 0 8px}
.ligne{display:flex;align-items:center;gap:11px;padding:9px 0;border-top:1px solid var(--trait)}
.ligne:first-of-type{border-top:0}
.ligne .pastille{width:28px;height:28px;border-radius:100px;display:grid;place-items:center;font-size:14px;flex-shrink:0}
.ligne .info{flex:1;min-width:0}
.ligne .info b{font-size:13.5px;font-weight:500;display:block}
.ligne .info span{font-size:11.5px;color:var(--creme-40)}
.ligne .gain{font-family:var(--display);font-size:14px;color:var(--laiton)}
.ligne .sup{background:none;border:0;color:var(--creme-40);font:inherit;font-size:17px;cursor:pointer;padding:0 2px;line-height:1}

/* --- podium / badges --- */
.rang{display:flex;align-items:center;gap:12px;padding:13px 0;border-top:1px solid var(--trait)}
.rang:first-of-type{border-top:0}
.rang .pos{font-family:var(--display);font-size:15px;width:22px;color:var(--creme-40)}
.rang.tete .pos{color:var(--laiton)}
.rang .pastille{width:38px;height:38px;border-radius:100px;display:grid;place-items:center;font-size:19px;flex-shrink:0}
.rang .who{flex:1;min-width:0}
.rang .who b{display:block;font-size:15px;font-weight:600}
.rang .who span{font-size:11.5px;color:var(--creme-40)}
.rang .tot{font-family:var(--display);font-size:21px}
.niveau{margin-top:6px;height:5px;border-radius:100px;background:var(--bleu-900);overflow:hidden}
.niveau i{display:block;height:100%;background:var(--laiton)}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.badge{
  font-size:11px;padding:5px 9px;border-radius:100px;border:1px solid var(--trait);
  background:var(--bleu-800);color:var(--creme-60);display:flex;gap:5px;align-items:center;
}
.badge.acquis{border-color:rgba(224,168,60,.5);color:var(--laiton);background:rgba(224,168,60,.08)}

/* --- réglages --- */
label.champ{display:block;margin-bottom:12px}
label.champ .lb{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--creme-40);display:block;margin-bottom:6px}
input,select,textarea{
  width:100%;background:var(--bleu-900);border:1px solid var(--trait);color:var(--creme);
  font:inherit;font-size:16px;padding:10px 12px;border-radius:9px;
}
input:focus,select:focus,textarea:focus,button:focus-visible,.tuile:focus-visible{outline:2px solid var(--laiton);outline-offset:2px}
textarea{min-height:88px;font-size:16px;font-family:ui-monospace,monospace;resize:vertical;line-height:1.35}
.bouton{
  background:var(--creme);color:var(--bleu-900);border:0;border-radius:9px;font:inherit;font-weight:600;
  padding:11px 16px;cursor:pointer;width:100%;font-size:14px;
}
.bouton.fant{background:transparent;color:var(--creme);border:1px solid var(--trait)}
.bouton.danger{background:transparent;color:var(--rouge);border:1px solid rgba(210,69,47,.45)}
.duo{display:flex;gap:8px}
.bascule{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-top:1px solid var(--trait)}
.bascule:first-of-type{border-top:0}
.bascule .txt b{display:block;font-size:14px;font-weight:600}
.bascule .txt span{font-size:11.5px;color:var(--creme-40)}
.interrupteur{position:relative;width:46px;height:27px;flex-shrink:0;border-radius:100px;background:var(--bleu-700);border:0;cursor:pointer;transition:background .2s}
.interrupteur::after{content:"";position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:100px;background:var(--creme-60);transition:transform .2s,background .2s}
.interrupteur[aria-pressed=true]{background:var(--vert)}
.interrupteur[aria-pressed=true]::after{transform:translateX(19px);background:#fff}
.item{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--trait)}
.item:first-of-type{border-top:0}
.item .em{font-size:19px;width:26px;text-align:center}
.item .lb{flex:1;font-size:13.5px;min-width:0}
.item .lb small{display:block;color:var(--creme-40);font-size:11px}
.item .mini,.duojoueur .mini{background:none;border:1px solid var(--trait);color:var(--creme-60);border-radius:8px;font:inherit;font-size:12px;padding:9px 11px;cursor:pointer;min-height:40px}

/* --- avatars --- */
.pastille{overflow:hidden}
.pastille svg{display:block;width:100%;height:100%}
.atelier{display:flex;flex-direction:column;align-items:center;gap:12px;margin-bottom:18px}
.atelier .miroir{width:124px;height:124px;border-radius:100px;overflow:hidden;border:2px solid var(--trait);background:var(--bleu-900)}
.atelier .miroir svg{width:100%;height:100%;display:block}
.atelier .hasard{background:var(--bleu-800);border:1px solid var(--trait);color:var(--creme);font:inherit;font-size:13px;padding:8px 16px;border-radius:100px;cursor:pointer}
.rayon{margin-bottom:14px}
.rayon .sourcil{margin-bottom:7px}
.rangee{display:flex;gap:8px;overflow-x:auto;padding:3px 16px 3px;margin:0 -16px;scrollbar-width:none}
.rangee::-webkit-scrollbar{display:none}
.opt{
  flex-shrink:0;width:48px;height:48px;border-radius:100px;padding:0;cursor:pointer;overflow:hidden;
  border:2px solid transparent;background:var(--bleu-900);
}
.opt svg{display:block;width:100%;height:100%}
.opt[aria-pressed=true]{border-color:var(--laiton)}
.opt.teinte{width:34px;height:34px;border-width:2px}

/* --- modale --- */
.voile{position:fixed;inset:0;z-index:70;background:rgba(5,20,25,.72);display:grid;place-items:end center;padding:0}
.feuille{
  position:relative;
  background:var(--bleu-850);border-top:1px solid var(--trait);border-radius:18px 18px 0 0;
  width:100%;max-width:560px;padding:0 16px calc(26px + env(safe-area-inset-bottom));
  max-height:88vh;overflow-y:auto;overscroll-behavior:contain;
  animation:monte .25s cubic-bezier(.2,.9,.3,1)
}
.tetefeuille{
  position:sticky;top:0;z-index:4;display:flex;justify-content:flex-end;align-items:center;
  margin:0 -16px 12px;padding:9px 12px 9px;
  background:var(--bleu-850);border-radius:18px 18px 0 0;
  box-shadow:0 8px 12px -8px rgba(10,39,48,.9);
}
.poignee{
  position:absolute;left:50%;top:11px;transform:translateX(-50%);
  width:42px;height:4px;border-radius:4px;background:rgba(244,235,216,.24);
}
.fermer{
  width:40px;height:40px;border-radius:100px;flex-shrink:0;
  background:var(--bleu-800);border:1px solid var(--trait);color:var(--creme);
  font-size:15px;line-height:1;cursor:pointer;display:grid;place-items:center;
}
.fermer:active{background:var(--bleu-700)}
@keyframes monte{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
.feuille h3{font-size:17px;margin-bottom:14px}
.duojoueur{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.duojoueur .choixjoueur{margin-bottom:0;flex:1;min-width:0}
.duojoueur .mini{flex-shrink:0;padding:9px 11px}
.choixjoueur{display:flex;align-items:center;gap:12px;width:100%;background:var(--bleu-800);border:1px solid var(--trait);color:var(--creme);font:inherit;padding:11px;border-radius:11px;margin-bottom:8px;cursor:pointer;text-align:left}
.choixjoueur .pastille{width:34px;height:34px;border-radius:100px;display:grid;place-items:center;font-size:17px}

/* --- bannière d'installation --- */
.bandeauInstall{
  position:fixed;left:10px;right:10px;bottom:calc(80px + env(safe-area-inset-bottom));z-index:40;
  max-width:540px;margin:0 auto;display:flex;align-items:center;gap:11px;
  background:var(--bleu-800);border:1px solid var(--trait);border-radius:14px;padding:11px 12px;
  box-shadow:0 12px 30px -10px rgba(5,20,25,.7);animation:monte .3s cubic-bezier(.2,.9,.3,1);
}
body.sansonglets .bandeauInstall{bottom:calc(16px + env(safe-area-inset-bottom))}
.bandeauInstall .ic{font-size:24px}
.bandeauInstall .txt{flex:1;min-width:0}
.bandeauInstall .txt b{display:block;font-size:14px}
.bandeauInstall .txt span{font-size:11.5px;color:var(--creme-60);line-height:1.35}
.bandeauInstall .poser{background:var(--laiton);color:var(--bleu-900);border:0;border-radius:9px;font:inherit;font-weight:600;font-size:13px;padding:9px 14px;cursor:pointer;flex-shrink:0}
.bandeauInstall .fermerInstall{background:none;border:0;color:var(--creme-40);font-size:15px;cursor:pointer;flex-shrink:0;padding:4px 6px}

/* --- écran d'accueil --- */
body.sansonglets{padding-bottom:30px}
[hidden]{display:none !important}
.accueil{display:flex;flex-direction:column;align-items:center;text-align:center;padding:34px 0 20px}
.accueil .blason{width:98px;height:98px;border-radius:100px;overflow:hidden;border:2px solid var(--trait);margin-bottom:18px}
.accueil .blason svg{width:100%;height:100%;display:block}
.accueil h1{font-size:35px;letter-spacing:-.025em;margin-bottom:10px}
.accueil .pitch{font-size:14.5px;color:var(--creme-60);max-width:310px;margin:0 0 26px;line-height:1.5}
.accueil .bouton{max-width:330px;margin-bottom:9px}
.lienplat{background:none;border:0;color:var(--creme-40);font:inherit;font-size:13px;text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:9px;margin-top:4px}
.duo .bouton[aria-pressed=true]{background:var(--creme);color:var(--bleu-900);border-color:var(--creme)}

/* --- viseur caméra --- */
.cameraCadre{
  position:relative;width:100%;aspect-ratio:3/4;max-height:56vh;border-radius:16px;overflow:hidden;
  background:#000;border:1px solid var(--trait);
}
.cameraCadre video{width:100%;height:100%;object-fit:cover;display:block}
.camViseur{
  position:absolute;inset:0;pointer-events:none;
  box-shadow:inset 0 0 0 3px rgba(241,239,227,.25), inset 0 0 60px rgba(0,0,0,.4);
  border-radius:16px;
}
.camViseur::before,.camViseur::after{
  content:"";position:absolute;width:26px;height:26px;border:3px solid var(--laiton);
}
.camViseur::before{top:14px;left:14px;border-right:0;border-bottom:0;border-radius:6px 0 0 0}
.camViseur::after{bottom:14px;right:14px;border-left:0;border-top:0;border-radius:0 0 6px 0}
#camShot{font-size:16px}

/* --- aperçu photo et tri --- */
.apercuPhoto{
  width:100%;border-radius:14px;overflow:hidden;background:var(--bleu-900);
  border:1px solid var(--trait);margin-bottom:14px;aspect-ratio:4/3;
}
.apercuPhoto img{width:100%;height:100%;object-fit:cover;display:block}
.tri{
  display:flex;align-items:center;gap:12px;padding:13px;border-radius:12px;border:1px solid var(--trait);
}
.tri .triEmoji{font-size:28px;flex-shrink:0}
.tri .triTxt{flex:1;min-width:0}
.tri .triTxt b{display:block;font-size:14px;line-height:1.3}
.tri .triTxt span{font-size:12px;color:var(--creme-60)}
.tri .triPts{font-family:var(--display);font-size:22px;color:var(--laiton);flex-shrink:0}

/* --- sélecteur de ligues --- */
.listeligues{
  max-height:52vh;overflow-y:auto;overscroll-behavior:contain;
  margin:0 -4px;padding:0 4px;display:flex;flex-direction:column;gap:8px;
}
.choixligue{
  display:flex;align-items:center;gap:11px;width:100%;text-align:left;
  background:var(--bleu-800);border:1px solid var(--trait);color:var(--creme);
  font:inherit;padding:12px;border-radius:11px;cursor:pointer;min-height:56px;
}
.choixligue.active{border-color:var(--vert);background:rgba(127,176,107,.1)}
.choixligue .ici{
  font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--vert);
  border:1px solid rgba(127,176,107,.5);border-radius:100px;padding:3px 8px;flex-shrink:0;
}
.actionsligues{

  get(k, def){
    try{ const v = localStorage.getItem(k); return v===null ? def : JSON.parse(v); }
    catch(e){ return k in memoire ? memoire[k] : def; }
  },
  set(k, v){
    try{ localStorage.setItem(k, JSON.stringify(v)); }
    catch(e){ memoire[k] = v; }
  }
};

function codeLigue(){
  const t = new Uint8Array(12);
  if(window.crypto && crypto.getRandomValues) crypto.getRandomValues(t);
  else for(let i=0;i<12;i++) t[i] = Math.floor(Math.random()*256);
  const b = [...t].map(n=>ALPHABET[n % ALPHABET.length]).join("");
  return b.slice(0,4)+"-"+b.slice(4,8)+"-"+b.slice(8,12);
}

function eclaircir(hex, k){
  const n = parseInt(hex.slice(1),16);
  const m = (v)=>Math.round(v + (255-v)*k);
  return "#" + ((1<<24) + (m((n>>16)&255)<<16) + (m((n>>8)&255)<<8) + m(n&255)).toString(16).slice(1);
}
function assombrir(hex, k){
  const n = parseInt(hex.slice(1),16);
  const r = Math.round(((n>>16)&255)*k), v = Math.round(((n>>8)&255)*k), b = Math.round((n&255)*k);
  return "#" + ((1<<24)+(r<<16)+(v<<8)+b).toString(16).slice(1);
}
function avatarAuto(graine){
  let h = 7;
  for(let i=0;i<String(graine).length;i++) h = (h*33 + String(graine).charCodeAt(i)) >>> 0;
  const p = n => { h = (h*1103515245 + 12345) >>> 0; return h % n; };
  return {animal:0, peau:p(PEAUX.length), coif:p(COIFFURES.length), coifC:p(TIGNASSE.length),
          yeux:p(YEUX.length), bouche:p(BOUCHES.length), acc:p(ACCESSOIRES.length)};
}
function avatarHasard(){
  const p = n => Math.floor(Math.random()*n);
  return {animal:p(ANIMAUX.length), peau:p(PEAUX.length), coif:p(COIFFURES.length),
          coifC:p(TIGNASSE.length), yeux:p(YEUX.length), bouche:p(BOUCHES.length),
          acc:p(ACCESSOIRES.length)};
}
function avatarSVG(a, couleur){

  couleur = couleur || COULEURS[0];
  const bete = ANIMAUX[(a.animal||0) % ANIMAUX.length];

  const acc  = ACCESSOIRES[a.acc % ACCESSOIRES.length];
  const fond = `<rect width="100" height="100" fill="${assombrir(couleur,.42)}"/>`;
  const buste = `<path d="M16 100c0-16 15-22 34-22s34 6 34 22Z" fill="${couleur}"/>
    <path d="M40 79c3 5 17 5 20 0-3 8-17 8-20 0Z" fill="${assombrir(couleur,.8)}"/>`;

  if(bete){
    const poil  = chev;
    const clair = eclaircir(poil, .42);
    return `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Avatar animal">
      ${fond}
      ${bete.oreilles(poil, clair)}

      <ellipse cx="50" cy="52" rx="23.5" ry="25" fill="${poil}"/>

      ${YEUX[a.yeux % YEUX.length]()}
      ${BOUCHES_BETE[a.bouche % BOUCHES_BETE.length]()}
      ${acc.sur ? acc.sur(poil, couleur) : ""}
    </svg>`;
  }

  const peau = PEAUX[a.peau % PEAUX.length];
  const coif = COIFFURES[a.coif % COIFFURES.length];
  return `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Avatar">
    ${fond}
    ${coif.arriere(chev)}
    <rect x="43" y="64" width="14" height="18" rx="6" fill="${assombrir(peau,.86)}"/>

    ${BOUCHES[a.bouche % BOUCHES.length]()}
    ${coif.devant(chev)}
    ${acc.sur ? acc.sur(chev, couleur) : ""}
  </svg>`;
}

      id:"t"+i, nom:t[0], emoji:t[1], points:t[2], frequence:t[3], categorie:t[4]

/* ---------- 3. état ---------- */
/* Plusieurs ligues cohabitent sur l'appareil. Chacune a sa clé, et ses données
   sont rangées sous des clés de stockage distinctes. */

let courante = local.get("col.courante", null);

function migrer(){

    const cle = estCloud ? vieux.code : "solo";
    ligues = [{cle, code: estCloud ? vieux.code : "", mode: estCloud ? "cloud" : "local",
               nom: vieilleCfg.nom || "Ma ligue"}];

    local.set("col.entrees."+cle, local.get("col.entrees", []));
    local.set("col.moi."+cle, local.get("col.moi", null));

}

function chargerLigue(cle){

function inscrireLigue(l){

/* ---------- 4. calculs ---------- */
const JOUR = 86400000;
function debutSemaine(d){
  const x = new Date(d===undefined ? Date.now() : d);
  x.setDate(x.getDate() - ((x.getDay()+6)%7));
  x.setHours(0,0,0,0);
  return x.getTime();
}
function debutJour(t){ const x=new Date(t); x.setHours(0,0,0,0); return x.getTime(); }
function debutPeriode(){ return cfg.type==="datee" ? cfg.saison : debutSemaine(); }
function ligueTerminee(){ return cfg.type==="datee" && cfg.fin && Date.now() > cfg.fin; }
function motPeriode(){ return cfg.type==="datee" ? "du séjour" : "de la semaine"; }
function joueur(id){ return cfg.joueurs.find(j=>j.id===id) || {nom:"Inconnu", emoji:"👻", couleur:"#888"}; }
function tache(id){ return cfg.taches.find(t=>t.id===id); }

function dernierPassage(idTache){
  let d = 0;
  for(const e of entrees){ if(e.tacheId===idTache && e.ts>d) d = e.ts; }
  return d || cfg.saison;
}
function enRetard(t){ return false; }  /* pas de notion de retard pour un ramassage */
function retardJours(t){ return 0; }
/* quête du jour : tirage déterministe sur la date + le code du foyer */
function queteDuJour(){
  if(!cfg.modes.rpg || !cfg.taches.length) return null;
  const graine = new Date().toDateString() + (sync.code||"foyer");
  let h = 0;
  for(let i=0;i<graine.length;i++) h = (h*31 + graine.charCodeAt(i)) >>> 0;
  return cfg.taches[h % cfg.taches.length];
}
function calculPoints(t){
  const retard = enRetard(t);
  const q = queteDuJour();
  const estQuete = q && q.id===t.id;
  let mult = 1;
  if(retard) mult *= 1.5;
  if(estQuete) mult *= 2;
  return {base:t.points, mult, points:Math.round(t.points*mult), retard, quete:!!estQuete};
}

function totaux(depuis){
  const m = {};
  for(const j of cfg.joueurs) m[j.id] = 0;
  for(const e of entrees){ if(e.ts>=depuis && e.joueurId in m) m[e.joueurId] += e.points; }
  return m;
}
function statsJoueur(id){
  const mien = entrees.filter(e=>e.joueurId===id).sort((a,b)=>a.ts-b.ts);
  const s = {total:mien.length, megots:0, lourds:0, dangereux:false, variete:0,
             familles:0, recordJour:0, serie:0, xp:0};
  const types = new Set(), fams = new Set(), parJour = {};
  for(const e of mien){
    s.xp += e.points;
    if(e.tacheNom && /mégot/i.test(e.tacheNom)) s.megots++;
    if(e.base>=25) s.lourds++;
    if(e.categorie === "Déchetterie" && /dangereux|seringue/i.test(e.tacheNom||"")) s.dangereux = true;
    types.add(e.tacheId);
    if(e.categorie) fams.add(e.categorie);
    const d = debutJour(e.ts);
    parJour[d] = (parJour[d]||0)+1;
  }
  s.variete = types.size;
  s.familles = fams.size;
  s.recordJour = Math.max(0, ...Object.values(parJour));
  /* série de jours consécutifs se terminant aujourd'hui ou hier */
  const jours = Object.keys(parJour).map(Number).sort((a,b)=>b-a);
  if(jours.length){
    const auj = debutJour(Date.now());
    if(jours[0]===auj || jours[0]===auj-JOUR){
      s.serie = 1;
      for(let i=1;i<jours.length;i++){
        if(jours[i-1]-jours[i]===JOUR) s.serie++; else break;
      }
    }
  }
  return s;
}
function niveau(xp){
  let i = 0;
  while(i+1 < NIVEAUX.length && xp >= NIVEAUX[i+1][0]) i++;
  const bas = NIVEAUX[i][0];
  const haut = i+1 < NIVEAUX.length ? NIVEAUX[i+1][0] : bas;
  const part = haut>bas ? (xp-bas)/(haut-bas) : 1;
  return {rang:i+1, titre:NIVEAUX[i][1], part, restant:Math.max(0,haut-xp), dernier:i+1===NIVEAUX.length};
}

/* un lien d'invitation transporte le nom du foyer et la clé Firebase, rien d'autre */
const encoder = o => btoa(String.fromCharCode(...new TextEncoder().encode(JSON.stringify(o))))
  .replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
const decoder = t => JSON.parse(new TextDecoder().decode(
  Uint8Array.from(atob(t.replace(/-/g,"+").replace(/_/g,"/")), c=>c.charCodeAt(0))));

function lireInvitation(){
  const direct = location.hash.match(/ligue=([a-z0-9\-]+)/i);
  if(direct){
    rejoindreLigue(direct[1].toLowerCase());
    history.replaceState(null, "", location.pathname + location.search);
    return sync.code;
  }
  const ancien = location.hash.match(/rejoindre=([A-Za-z0-9\-_]+)/);
  if(ancien){
    try{
      const d = decoder(ancien[1]);
      sync = {mode:"cloud", code:d.c};
      local.set("col.sync", sync);
      history.replaceState(null, "", location.pathname + location.search);
      return d.c;
    }catch(e){ console.warn("Invitation illisible", e); }
  }
  return null;
}

function rejoindreLigue(code){
  couperSync();
  if(!ligues.find(l => l.cle === code)){
    inscrireLigue({cle:code, code, mode:"cloud", nom:"Ligue " + code.slice(0,4)});
  }
  chargerLigue(code);
}

function etatSync(etat, msg){
  const el = document.getElementById("etatsync");
  el.className = "etatsync" + (etat==="on" ? " on" : etat==="err" ? " err" : "");
  el.title = msg || (etat==="on" ? "Synchronisé" : "Mode local");
  if(etat==="err") console.warn("Synchro :", msg);
}

async function brancherSync(){
  if(sync.mode !== "cloud" || !sync.code){
    etatSync("off");
    return {ok:false, message:"Aucune ligue sélectionnée."};
  }
  const conf = FIREBASE;
  try{
    const v = "https://www.gstatic.com/firebasejs/10.12.5/";
    const [app, auth, fs] = await Promise.all([
      import(v+"firebase-app.js"),
      import(v+"firebase-auth.js"),
      import(v+"firebase-firestore.js")
    ]);
    const a = app.initializeApp(conf);
    const at = auth.getAuth(a);
    await auth.signInAnonymously(at);
    let db;
    try{
      db = fs.initializeFirestore(a, {localCache: fs.persistentLocalCache()});
    }catch(e){ db = fs.getFirestore(a); }

    const docFoyer = fs.doc(db, "foyers", sync.code);
    const colEntrees = fs.collection(db, "foyers", sync.code, "entrees");
    cloud = {db, docFoyer, colEntrees, setDoc:fs.setDoc, addDoc:fs.addDoc,
             deleteDoc:fs.deleteDoc, doc:fs.doc};

    const instant = await fs.getDoc(docFoyer);
    if(!instant.exists()) await fs.setDoc(docFoyer, cfg);

    desabo.push(fs.onSnapshot(docFoyer, s=>{
      if(s.exists()){ cfg = Object.assign(configDefaut(), s.data()); sauverLocal(); rendre(); }
    }, e=>etatSync("err", e.message)));

    desabo.push(fs.onSnapshot(fs.query(colEntrees, fs.orderBy("ts","desc"), fs.limit(200)), s=>{
      entrees = s.docs.map(d=>Object.assign({id:d.id}, d.data())).sort((a,b)=>a.ts-b.ts);
      sauverLocal();
      rendre();
    }, e=>etatSync("err", e.message)));

    etatSync("on","Ligue « "+sync.code+" » synchronisée");
    return {ok:true};
  }catch(e){
    etatSync("err", e.message);
    return {ok:false, message:e.message, code:e.code||""};
  }
}

function vueFaire(){
  let h = "";
  const sem = debutPeriode();
  const t = totaux(sem);
  const somme = Object.values(t).reduce((a,b)=>a+b,0);

  const classe = [...cfg.joueurs].sort((x,y)=>t[y.id]-t[x.id]);
  const meneur = classe[0];
  const objectifAtteint = cfg.modes.cooperatif && cfg.objectif && somme >= cfg.objectif;

  /* Un seul bloc : on coopère pour remplir la jauge commune, et celui qui a le plus
     porté l'effort est mis à l'honneur. La course n'est plus un jeu séparé mais la
     lecture de qui contribue le plus au but commun. */
  if(cfg.modes.cooperatif || (cfg.modes.competition && cfg.joueurs.length>1)){
    h += `<div class="plaque">`;

    if(cfg.modes.cooperatif){
      const part = Math.min(100, cfg.objectif ? somme/cfg.objectif*100 : 0);
      h += `<p class="sourcil">Objectif ${motPeriode()}
        <b>${objectifAtteint ? "Atteint 🎉" : Math.max(0,cfg.objectif-somme)+" pts restants"}</b></p>
        <div class="jauge ${objectifAtteint?"atteint":""}"><i style="width:${part}%"></i>
          <u><span>${somme} pts</span><span>${cfg.objectif}</span></u></div>`;
      if(cfg.recompense){
        h += `<p class="recompense">${objectifAtteint?"Débloqué":"À la clé"} : <b>${esc(cfg.recompense)}</b></p>`;
      }
      if(objectifAtteint && cfg.modes.competition && meneur && t[meneur.id]>0){
        h += `<p class="recompense" style="margin-top:6px">Plus gros contributeur :
          <b>${esc(meneur.nom)}</b>, ${t[meneur.id]} points.</p>`;
      }
    }

    if(cfg.modes.competition && cfg.joueurs.length>1){
      const max = Math.max(1, ...Object.values(t));
      h += `<p class="sourcil" style="margin-top:${cfg.modes.cooperatif?"16px":"0"}">
        ${ligueTerminee() ? "Classement final" : cfg.modes.cooperatif ? "Qui contribue le plus" : "Course "+motPeriode()}</p>
        <div class="course">` +
        classe.map((j,i)=>`<div class="piste">
          <span class="pastille">${portrait(j)}</span>
          <span class="nom">${esc(j.nom)}${i===0&&t[j.id]>0?" 👑":""}</span>
          <span class="barre"><i style="width:${t[j.id]/max*100}%;background:${j.couleur}"></i></span>
          <span class="pts">${t[j.id]}<small> pts</small></span>
        </div>`).join("") + `</div>`;
    }

    h += `</div>`;
  }

  const q = queteDuJour();
  if(q){
    h += `<div class="plaque quete">
      <span class="ico">${q.emoji}</span>
      <span class="txt"><b>Quête du jour : ${esc(q.nom)}</b><span>Points doublés jusqu'à minuit</span></span>
      <span class="mult">×2</span>
    </div>`;
  }

  const neuf = cfg.joueurs.some(j=>/^Joueur \d+$/.test(j.nom));
  if(neuf){
    h += `<div class="plaque" style="border-color:rgba(224,168,60,.45)">
      <p class="sourcil">Première partie</p>
      <p style="margin:0 0 12px;font-size:14px">Chacun choisit son prénom et compose son avatar : teint, coiffure, regard, accessoires.
      Ensuite, déclarer une tâche tient en un appui.</p>
      <button class="bouton" data-ouvrirjoueurs="1">Créer les joueurs</button>
    </div>`;
  }else if(!moi){
    h += `<div class="rubanhaut">Choisis qui tu es en haut à droite avant de déclarer une tâche.</div>`;
  }

  const cats = ["Tout", ...new Set(cfg.taches.map(t=>t.categorie))];
  const nbRetard = cfg.taches.filter(enRetard).length;
  h += `<div class="filtres">` +
    cats.map(c=>`<button data-filtre="${esc(c)}" aria-pressed="${filtre===c}">${esc(c)}</button>`).join("") +
    (nbRetard ? `<button data-filtre="Retard" aria-pressed="${filtre==="Retard"}">En retard<span class="n">${nbRetard}</span></button>` : "") +
    `</div>`;

  let liste = cfg.taches.filter(t =>
    filtre==="Tout" ? true : filtre==="Retard" ? enRetard(t) : t.categorie===filtre);
  liste = liste.map(t=>({t, c:calculPoints(t)}))
               .sort((a,b)=> (b.c.retard?1:0)-(a.c.retard?1:0) || (b.c.quete?1:0)-(a.c.quete?1:0));

  if(!liste.length) h += `<p class="vide">Rien dans cette catégorie.<br>Ajoute un type de déchet dans Réglages.</p>`;

  const derniere = entrees[entrees.length-1];
  if(derniere && Date.now()-derniere.ts < 900000){
    h += `<div class="plaque" style="margin-top:12px">
      <div class="ligne"><span class="pastille" style="background:${joueur(derniere.joueurId).couleur}33">${derniere.emoji}</span>
      <span class="info"><b>${esc(derniere.tacheNom)}</b><span>${esc(joueur(derniere.joueurId).nom)}, il y a ${Math.max(1,Math.round((Date.now()-derniere.ts)/60000))} min</span></span>

  return h;

}

  if(!entrees.length) return `<p class="vide">Rien ramassé pour l'instant.<br>Prends ton premier déchet en photo dans l'onglet Ramasser.</p>`;
  const parJour = {};
  for(const e of [...entrees].reverse().slice(0,200)){

  return Object.keys(parJour).sort((a,b)=>b-a).map(d=>{
    const dd = Number(d), auj = debutJour(Date.now());
    const titre = dd===auj ? "Aujourd'hui" : dd===auj-JOUR ? "Hier"

    const total = parJour[d].reduce((a,e)=>a+e.points,0);
    return `<p class="jour">${titre} · ${total} points</p><div class="plaque">` +

/* ---------- 7. modales ---------- */
/* Une entrée d'historique est empilée à l'ouverture : le bouton retour d'Android
   referme la fenêtre au lieu de quitter le jeu. */
let pousse = false;

function ouvrir(html){
  if(!pousse){
    try{ history.pushState({menagerie:"fenetre"}, ""); pousse = true; }catch(e){}
  }
  const v = document.createElement("div");
  v.className = "voile";
  v.innerHTML = `<div class="feuille">
    <div class="tetefeuille"><span class="poignee"></span>
      <button class="fermer" type="button" aria-label="Fermer">✕</button></div>
    ${html}</div>`;
  v.addEventListener("click", ev=>{
    if(ev.target === v || ev.target.closest(".fermer")) fermer();
  });
  document.body.appendChild(v);
  document.body.style.overflow = "hidden";
  return v;
}

function fermer(){
  document.querySelectorAll(".voile").forEach(v => v.remove());
  document.body.style.overflow = "";
  /* certains parcours enchaînent une fenêtre sur l'autre : on ne dépile
     qu'une fois certain qu'aucune autre ne s'est ouverte dans la foulée */
  setTimeout(()=>{
    if(!document.querySelector(".voile") && pousse){
      pousse = false;
      try{ history.back(); }catch(e){}
    }
  }, 0);
}

window.addEventListener("popstate", ()=>{
  pousse = false;
  if(document.querySelector(".voile")){
    document.querySelectorAll(".voile").forEach(v => v.remove());
    document.body.style.overflow = "";
  }
});

/* Échap ferme aussi, pour ceux qui jouent au clavier */
document.addEventListener("keydown", e=>{
  if(e.key === "Escape" && document.querySelector(".voile")) fermer();
});

function modaleJoueurs(){
  const v = ouvrir(`<h3>Qui déclare ?</h3>` + cfg.joueurs.map(j=>
    `<div class="duojoueur">
      <button class="choixjoueur" data-choix="${j.id}">

    </div>`).join("") +
    `<button class="bouton fant" data-modjoueur="nouveau" style="margin-top:6px">Ajouter un joueur</button>`);
  v.querySelectorAll("[data-choix]").forEach(b=>b.onclick = ()=>{
    poserMoi(b.dataset.choix); fermer(); rendre();
  });
  v.querySelectorAll("[data-modjoueur]").forEach(b=>b.onclick = ()=>{
    fermer(); modaleJoueur(b.dataset.modjoueur);
  });
}

function rejoindreCommeMoi(){
  const ident = monIdentite();
  if(!ident){ modaleJoueur("nouveau"); return; }
  const existant = cfg.joueurs.find(j => j.nom.toLowerCase() === ident.nom.toLowerCase());
  if(existant){ poserMoi(existant.id); rendre(); return; }
  const j = {id:"j"+Date.now(), nom:ident.nom, av:ident.av, couleur:ident.couleur, emoji:"🙂"};
  cfg.joueurs = [...cfg.joueurs, j];
  poserMoi(j.id);
  ecrireConfig();
}

function modaleJoueur(id){
  const nouveau = id==="nouveau";
  const ident = monIdentite();
  const base = nouveau
    ? (ident
        ? {id:"j"+Date.now(), nom:ident.nom, couleur:ident.couleur, av:ident.av}
        : {id:"j"+Date.now(), nom:"", couleur:COULEURS[cfg.joueurs.length % COULEURS.length]})
    : joueur(id);
  let a = Object.assign({animal:0}, base.av || avatarAuto(base.id));
  let couleur = base.couleur;

  const v = ouvrir(`<h3>${nouveau?"Nouveau joueur":"Modifier "+esc(base.nom)}</h3>
    <div id="atelier"></div>
    <label class="champ"><span class="lb">Prénom</span>
      <input id="mNom" value="${esc(base.nom)}" placeholder="Agathe" autocomplete="off"></label>
    <button class="bouton" id="mOk">Enregistrer</button>
    ${nouveau?"":`<button class="bouton danger" id="mSup" style="margin-top:8px">Retirer ce joueur</button>`}`);

  const boite = v.querySelector("#atelier");

  /* une rangée d'options : chaque bouton montre l'avatar tel qu'il serait */
  function rangee(titre, cle, nb, apercu){
    return `<div class="rayon"><p class="sourcil">${titre}</p><div class="rangee">` +
      Array.from({length:nb}, (_,i)=>
        `<button class="opt${apercu?"":" teinte"}" data-cle="${cle}" data-val="${i}"
           aria-pressed="${a[cle]===i}" aria-label="${titre} ${i+1}"
           ${apercu?"":`style="background:${cle==="peau"?PEAUX[i]:cle==="coifC"?TIGNASSE[i]:COULEURS[i]}"`}>
          ${apercu ? avatarSVG(Object.assign({}, a, {[cle]:i}), couleur) : ""}
        </button>`).join("") + `</div></div>`;
  }

  function dessine(){
    boite.innerHTML = `
      <div class="atelier">
        <div class="miroir">${avatarSVG(a, couleur)}</div>
        <button type="button" class="hasard" id="mHasard">🎲 Au hasard</button>
      </div>
      ${rangee("Espèce","animal",ANIMAUX.length,true)}
      ${(a.animal||0) > 0
        ? rangee("Pelage","coifC",TIGNASSE.length,false)
        : rangee("Teint","peau",PEAUX.length,false)
          + rangee("Coiffure","coif",COIFFURES.length,true)
          + rangee("Couleur de cheveux","coifC",TIGNASSE.length,false)}
      ${rangee("Regard","yeux",YEUX.length,true)}
      ${rangee("Bouche","bouche",(a.animal||0) > 0 ? BOUCHES_BETE.length : BOUCHES.length,true)}
      ${rangee("Accessoire","acc",ACCESSOIRES.length,true)}
      <div class="rayon"><p class="sourcil">Couleur du joueur</p><div class="rangee">` +
        COULEURS.map(c=>`<button class="opt teinte" data-couleur="${c}"
          aria-pressed="${c===couleur}" aria-label="Couleur ${c}" style="background:${c}"></button>`).join("") +
      `</div></div>`;
  }

  boite.addEventListener("click", e=>{
    const o = e.target.closest("[data-cle]");
    if(o){ a[o.dataset.cle] = +o.dataset.val; return dessine(); }
    const c = e.target.closest("[data-couleur]");
    if(c){ couleur = c.dataset.couleur; return dessine(); }
    if(e.target.closest("#mHasard")){ a = avatarHasard(); return dessine(); }
  });
  dessine();

  v.querySelector("#mOk").onclick = ()=>{
    const champ = v.querySelector("#mNom");
    const nom = champ.value.trim();
    if(!nom){ champ.focus(); return; }
    const maj = {id:base.id, nom, couleur, av:a, emoji:base.emoji || "🙂"};
    cfg.joueurs = nouveau ? [...cfg.joueurs, maj] : cfg.joueurs.map(x=>x.id===base.id?maj:x);
    /* Cette apparence devient mon identité de référence si : j'édite mon propre
       personnage ; ou je crée/édite un personnage alors que je n'ai pas encore
       d'identité sur cet appareil (typiquement le premier joueur d'une ligue). */
    if(moi === base.id || !monIdentite()){
      poserIdentite(maj);
      if(!moi) poserMoi(maj.id);
    }
    fermer(); ecrireConfig();
  };

  const sup = v.querySelector("#mSup");
  if(sup) sup.onclick = ()=>{
    if(!confirm("Retirer "+base.nom+" ? Son historique reste dans le journal.")) return;
    cfg.joueurs = cfg.joueurs.filter(x=>x.id!==base.id);
    if(moi===base.id) poserMoi(null);
    fermer(); ecrireConfig();
  };
}

function modaleTache(id){
  const nouvelle = id==="nouvelle";
  const t = nouvelle
    ? {id:"t"+Date.now(), nom:"", emoji:"✨", points:10, frequence:7, categorie:cfg.taches[0]?.categorie||"Logistique"}
    : tache(id);
  const cats = [...new Set([...cfg.taches.map(x=>x.categorie),"Cuisine","Sols","Linge","Sanitaires","Logistique","Enfants"])];
  const v = ouvrir(`<h3>${nouvelle?"Nouvelle tâche":"Modifier la tâche"}</h3>
    <label class="champ"><span class="lb">Intitulé</span><input id="mNom" value="${esc(t.nom)}" placeholder="Nettoyer le frigo"></label>
    <div class="duo">
      <label class="champ" style="flex:0 0 88px"><span class="lb">Emoji</span><input id="mEmoji" value="${t.emoji}"></label>
      <label class="champ" style="flex:1"><span class="lb">Points</span><input type="number" min="1" id="mPoints" value="${t.points}"></label>
    </div>
    <label class="champ"><span class="lb">À refaire tous les … jours (0 = jamais)</span>
      <input type="number" min="0" id="mFreq" value="${t.frequence}"></label>
    <label class="champ"><span class="lb">Catégorie</span>
      <select id="mCat">${cats.map(c=>`<option ${c===t.categorie?"selected":""}>${esc(c)}</option>`).join("")}</select></label>
    <button class="bouton" id="mOk">Enregistrer</button>
    ${nouvelle?"":`<button class="bouton danger" id="mSup" style="margin-top:8px">Supprimer la tâche</button>`}
    <p class="note">Barème conseillé : 5 à 10 points pour un geste rapide, 15 à 20 pour une vraie corvée, 25 et plus pour ce que personne ne veut faire.</p>`);
  v.querySelector("#mOk").onclick = ()=>{
    const nom = v.querySelector("#mNom").value.trim();
    if(!nom) return v.querySelector("#mNom").focus();
    const maj = {
      id:t.id, nom,
      emoji:v.querySelector("#mEmoji").value.trim()||"✨",
      points:Math.max(1, +v.querySelector("#mPoints").value||1),
      frequence:Math.max(0, +v.querySelector("#mFreq").value||0),
      categorie:v.querySelector("#mCat").value
    };
    cfg.taches = nouvelle ? [...cfg.taches, maj] : cfg.taches.map(x=>x.id===t.id?maj:x);
    fermer(); ecrireConfig();
  };
  const sup = v.querySelector("#mSup");
  if(sup) sup.onclick = ()=>{
    if(!confirm("Supprimer « "+t.nom+" » ?")) return;
    cfg.taches = cfg.taches.filter(x=>x.id!==t.id);
    fermer(); ecrireConfig();
  };
}

/* ---------- 8. déclarer une tâche ---------- */
function tamponner(points, libelle){
  const el = document.createElement("div");
  el.className = "tampon";
  el.innerHTML = `<div class="rond"><b>+${points}</b><span>${esc(libelle)}</span></div>`;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(), 640);
  if(navigator.vibrate) try{ navigator.vibrate(18); }catch(e){}
}



/* Déclarer = prendre une photo (obligatoire), la voir, confirmer. La photo ne
   quitte jamais l'appareil : elle sert de preuve sur le moment, puis on l'oublie. */
function declarer(idTache){
  if(!moi){ modaleJoueurs(); return; }
  const t = tache(idTache);
  if(!t) return;
  ouvrirCamera(t);
}

/* Repli : sur les navigateurs sans accès caméra (ou fichier ouvert en local),
   on retombe sur l'appareil photo du système via un input. */
function captureParInput(t){
  const input = document.createElement("input");
  input.type = "file";
  input.accept = "image/*";
  input.capture = "environment";
  input.style.display = "none";
  document.body.appendChild(input);
  input.onchange = ()=>{
    const fichier = input.files && input.files[0];
    input.remove();
    if(!fichier) return;
    confirmerRamassage(t, URL.createObjectURL(fichier));
  };
  input.click();
}

/* Vrai viseur dans l'app : la caméra s'ouvre, on cadre, on déclenche.
   Impose une photo prise sur le moment, et donne la sensation d'une vraie app. */
async function ouvrirCamera(t){
  const secure = window.isSecureContext;
  const dispo = navigator.mediaDevices && navigator.mediaDevices.getUserMedia;
  if(!secure || !dispo){ return captureParInput(t); }

  const pou = POUBELLES[t.categorie] || {emoji:"🗑️", couleur:"#888", ou:t.categorie};
  const v = ouvrir(`<h3>${t.emoji} ${esc(t.nom)}</h3>
    <div class="cameraCadre">
      <video id="camFlux" playsinline autoplay muted></video>
      <div class="camViseur"></div>
    </div>
    <div class="tri" style="border-color:${pou.couleur}66;background:${pou.couleur}14;margin-top:12px">
      <span class="triEmoji">${pou.emoji}</span>
      <span class="triTxt"><b>Prends-le en photo avant de le jeter</b>
        <span>Direction : ${esc(pou.ou)}</span></span>
    </div>
    <button class="bouton" id="camShot" style="margin-top:14px">📸 Photographier</button>
    <button class="bouton fant" id="camNon" style="margin-top:8px">Annuler</button>
    <p class="note" id="camNote" style="margin-top:10px">La photo reste sur ton téléphone, elle n'est envoyée nulle part.</p>`);

  const video = v.querySelector("#camFlux");
  let flux = null;

  function couper(){
    if(flux){ flux.getTracks().forEach(tr=>{ try{ tr.stop(); }catch(e){} }); flux = null; }
  }
  const fermerTout = ()=>{ couper(); fermer(); };
  v.querySelector("#camNon").onclick = fermerTout;
  /* couper la caméra si la fenêtre est fermée par la croix, Échap ou le bouton retour */
  v.addEventListener("click", e=>{ if(e.target.closest(".fermer")) couper(); });

  try{
    flux = await navigator.mediaDevices.getUserMedia({
      video:{ facingMode:{ ideal:"environment" } }, audio:false
    });
    video.srcObject = flux;
  }catch(err){
    fermerTout();
    /* permission refusée ou pas de caméra : on tente le repli système */
    return captureParInput(t);
  }

  v.querySelector("#camShot").onclick = ()=>{
    if(!flux) return;
    const w = video.videoWidth || 720, h = video.videoHeight || 960;
    const canvas = document.createElement("canvas");
    canvas.width = w; canvas.height = h;
    canvas.getContext("2d").drawImage(video, 0, 0, w, h);
    const url = canvas.toDataURL("image/jpeg", 0.8);
    couper();
    fermer();
    confirmerRamassage(t, url);
  };
}

function confirmerRamassage(t, url){
  const c = calculPoints(t);
  const pou = POUBELLES[t.categorie] || {emoji:"🗑️", couleur:"#888", ou:t.categorie};
  const v = ouvrir(`<h3>${t.emoji} ${esc(t.nom)}</h3>
    <div class="apercuPhoto"><img src="${url}" alt="Ta photo"></div>
    <div class="tri" style="border-color:${pou.couleur}66;background:${pou.couleur}14">
      <span class="triEmoji">${pou.emoji}</span>
      <span class="triTxt"><b>À jeter dans : ${esc(pou.ou)}</b>
        <span>${c.quete ? "Quête du jour — points doublés !" : "Beau geste."}</span></span>
      <span class="triPts">+${c.points}</span>
    </div>
    <button class="bouton" id="rOk" style="margin-top:14px">C'est jeté, je valide</button>
    <button class="bouton fant" id="rNon" style="margin-top:8px">Annuler</button>
    <p class="note" style="margin-top:10px">La photo reste sur ton téléphone : elle ne sert qu'à confirmer ton geste, elle n'est envoyée nulle part.</p>`);

  const nettoyer = ()=>{ try{ URL.revokeObjectURL(url); }catch(e){} };

  v.querySelector("#rOk").onclick = ()=>{
    tamponner(c.points, c.quete ? "quête du jour" : "ramassé");
    ajouterEntree({
      joueurId:moi, tacheId:t.id, tacheNom:t.nom, emoji:t.emoji, categorie:t.categorie,
      base:t.points, points:c.points, retard:false, quete:c.quete, ts:Date.now()
    });
    nettoyer();
    fermer();
    if(!dejaInstalle) setTimeout(proposerInstall, 1400);
  };
  v.querySelector("#rNon").onclick = ()=>{ nettoyer(); fermer(); };
}

/* ---------- 9. écouteurs ---------- */
document.getElementById("btnJoueur").onclick = modaleJoueurs;
document.getElementById("btnLigue").onclick = modaleLigues;

document.querySelector("nav.onglets").addEventListener("click", e=>{
  const b = e.target.closest("[data-onglet]");
  if(b){ onglet = b.dataset.onglet; rendre(); }
});

vue.addEventListener("click", async e=>{
  const t = e.target.closest("[data-tache]");
  if(t) return declarer(t.dataset.tache);

  const f = e.target.closest("[data-filtre]");
  if(f){ filtre = f.dataset.filtre; rendre(); return; }

  const a = e.target.closest("[data-annuler]");
  if(a){ if(confirm("Annuler cette déclaration ?")) supprimerEntree(a.dataset.annuler); return; }

  const mj = e.target.closest("[data-modjoueur]");
  if(mj) return modaleJoueur(mj.dataset.modjoueur);

  const mt = e.target.closest("[data-modtache]");
  if(mt) return modaleTache(mt.dataset.modtache);

  const bs = e.target.closest("[data-bascule]");
  if(bs){
    const c = bs.dataset.bascule;
    if(c==="datee"){
      cfg.type = cfg.type==="datee" ? "permanente" : "datee";
      if(cfg.type==="datee" && !cfg.fin) cfg.fin = Date.now() + 7*JOUR;
      ecrireConfig();
    }else{
      cfg.modes[c] = !cfg.modes[c];
      ecrireConfig();
    }
    return;
  }

  if(e.target.closest("[data-ouvrirjoueurs]")) return modaleJoueurs();
  if(e.target.id==="btnInviter") return modaleInvitation();
  if(e.target.closest("[data-creer]") || e.target.id==="btnCreer") return modaleCreer();
  if(e.target.closest("[data-rejoindre]") || e.target.id==="btnRejoindre") return modaleRejoindre();

  if(e.target.closest("[data-solo]")){
    const cle = "solo-" + Date.now().toString(36);
    couperSync();
    inscrireLigue({cle, code:"", mode:"local", nom:"Sur cet appareil"});
    chargerLigue(cle);
    cfg.nom = "Sur cet appareil";
    sauverLocal();
    etatSync("off");
    rendre();
    return;
  }

  if(e.target.id==="btnQuitter"){
    if(!confirm("Retirer « "+cfg.nom+" » de cet appareil ? Les autres joueurs gardent tout, et tu pourras revenir avec le code.")) return;
    couperSync();
    const parti = courante;
    ligues = ligues.filter(l => l.cle !== parti);
    local.set("col.ligues", ligues);
    chargerLigue(ligues.length ? ligues[0].cle : null);
    onglet = "faire";
    etatSync("off");
    rendre();
    if(sync.mode === "cloud") brancherSync().then(rendre);
    return;
  }

  if(e.target.id==="btnExport"){
    const blob = new Blob([JSON.stringify({cfg, entrees}, null, 2)], {type:"application/json"});
    const a2 = document.createElement("a");
    a2.href = URL.createObjectURL(blob);
    a2.download = "menagerie-" + new Date().toISOString().slice(0,10) + ".json";
    a2.click();
    return;
  }

  if(e.target.id==="btnImport"){
    const inp = document.createElement("input");
    inp.type = "file"; inp.accept = ".json";
    inp.onchange = async ()=>{
      try{
        const d = JSON.parse(await inp.files[0].text());
        if(d.cfg) cfg = Object.assign(configDefaut(), d.cfg);
        if(Array.isArray(d.entrees)) entrees = d.entrees;
        sauverLocal(); ecrireConfig();
      }catch(err){ alert("Fichier illisible : " + err.message); }
    };
    inp.click();
    return;
  }

  if(e.target.id==="btnSaison"){
    if(!confirm("Nouvelle saison : le journal et les niveaux repartent de zéro. Continuer ?")) return;
    cfg.saison = Date.now();
    if(cloud){ alert("Le journal partagé se videra au fil des prochaines synchronisations."); }
    entrees = [];
    sauverLocal(); ecrireConfig();
    return;
  }
});

vue.addEventListener("change", e=>{
  if(e.target.id==="chObjectif"){ cfg.objectif = Math.max(0, +e.target.value||0); ecrireConfig(); }
  if(e.target.id==="chRecompense"){ cfg.recompense = e.target.value; ecrireConfig(); }
  if(e.target.id==="chNomLigue"){ cfg.nom = e.target.value.trim() || "Ma ligue"; ecrireConfig(); }
  if(e.target.id==="chFin"){
    const d2 = new Date(e.target.value + "T23:59:59");
    if(!isNaN(d2)){ cfg.fin = d2.getTime(); ecrireConfig(); }
  }
});

/* ---------- 10. manifeste PWA embarqué ---------- */

      <circle cx="96" cy="96" r="58" fill="none" stroke="#F4EBD8" stroke-width="7"/>

/* ---------- 10 bis. proposer l'installation sur l'écran d'accueil ---------- */
const dejaInstalle =
  (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches)
  || window.navigator.standalone === true;
let promptInstall = null;

window.addEventListener("beforeinstallprompt", e=>{
  e.preventDefault();
  promptInstall = e;
  proposerInstall();
});

function estIOS(){
  return /iphone|ipad|ipod/i.test(navigator.userAgent)
    && !/crios|fxios/i.test(navigator.userAgent);  /* Safari uniquement gère l'ajout */
}

function proposerInstall(){
  if(dejaInstalle) return;
  if(local.get("col.installRefuse", 0) > Date.now()) return;
  if(document.querySelector(".bandeauInstall")) return;
  /* on n'insiste pas dès la première seconde : seulement une fois la personne engagée */
  if(!courante) return;

  const b = document.createElement("div");
  b.className = "bandeauInstall";
  b.innerHTML = `<span class="ic">📲</span>
    <span class="txt"><b>Installer Ménagerie</b><span>Comme une vraie app, en plein écran, accessible d'un geste.</span></span>
    <button class="poser" id="iInstall">Installer</button>
    <button class="fermerInstall" id="iPlus" aria-label="Plus tard">✕</button>`;
  document.body.appendChild(b);

  b.querySelector("#iPlus").onclick = ()=>{
    local.set("col.installRefuse", Date.now() + 7*JOUR);  /* on ne redemande pas avant une semaine */
    b.remove();
  };
  b.querySelector("#iInstall").onclick = async ()=>{
    if(promptInstall){
      b.remove();
      promptInstall.prompt();
      try{ await promptInstall.userChoice; }catch(e){}
      promptInstall = null;
    }else if(estIOS()){
      b.remove();
      ouvrir(`<h3>Ajouter à l'écran d'accueil</h3>
        <p class="note" style="margin-bottom:14px">Sur iPhone, deux gestes dans Safari :</p>
        <div class="item"><span class="em">1</span><span class="lb">Touche le bouton Partager en bas de l'écran
          <small>le carré avec une flèche vers le haut</small></span></div>
        <div class="item"><span class="em">2</span><span class="lb">Choisis « Sur l'écran d'accueil »
          <small>fais défiler un peu si tu ne le vois pas tout de suite</small></span></div>
        <p class="note" style="margin-top:12px">Ménagerie apparaîtra alors avec son icône, comme n'importe quelle application.</p>
        <button class="bouton" style="margin-top:8px" onclick="fermer()">C'est fait</button>`);
    }else{
      b.remove();
      ouvrir(`<h3>Ajouter à l'écran d'accueil</h3>
        <p class="note" style="margin-bottom:12px">Dans le menu de ton navigateur (les trois points),
        cherche « Installer l'application » ou « Ajouter à l'écran d'accueil ».</p>
        <button class="bouton" onclick="fermer()">C'est compris</button>`);
    }
  };
}

/* sur iPhone il n'y a pas d'évènement beforeinstallprompt : on propose nous-mêmes */
if(estIOS() && !dejaInstalle){
  setTimeout(proposerInstall, 4000);
}

/* ---------- 11. démarrage ---------- */
const ligueRejointe = lireInvitation();
etatSync("off");
rendre();
if(sync.mode === "cloud"){
  brancherSync().then(r=>{
    rendre();
    if(!ligueRejointe) return;
    const ident = monIdentite();
    const v = ouvrir(`<h3>Te voilà dans « ${esc(cfg.nom)} »</h3>
      <p class="note" style="margin-bottom:14px">${ident
        ? "Tu rejoins avec ton personnage habituel, "+esc(ident.nom)+"."
        : "Les tâches et le barème sont déjà réglés par la personne qui t'a invité. Il ne reste qu'à créer ton personnage."}</p>
      <div style="display:flex;justify-content:center;margin-bottom:14px">${ident
        ? `<span class="pastille" style="width:76px;height:76px;border-radius:100px">${avatarSVG(ident.av, ident.couleur)}</span>` : ""}</div>
      <button class="bouton" id="bChoix">${ident ? "C'est parti" : "Créer mon personnage"}</button>
      ${ident ? `<button class="bouton fant" id="bAutre" style="margin-top:8px">Choisir un autre personnage</button>` : ""}`);
    v.querySelector("#bChoix").onclick = ()=>{ fermer(); rejoindreCommeMoi(); };
    const ba = v.querySelector("#bAutre");
    if(ba) ba.onclick = ()=>{ fermer(); modaleJoueurs(); };
  });
}
/* la quête et les retards changent avec l'heure : rafraîchir de temps en temps */
setInterval(()=>{ if(onglet==="faire") rendre(); }, 300000);
</script>
